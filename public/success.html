<!DOCTYPE html>
<html>
<head>
  <title>Payment Success</title>
  <script>
    window.addEventListener("DOMContentLoaded", async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const orderId = urlParams.get("order_id");
      const token = localStorage.getItem("token");
      try {
        const res = await fetch(`http://localhost:3000/payments/payment-status/${orderId}`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        const data = await res.json();
          if (data.orderStatus === "Success") {
            localStorage.setItem("isPremium", "true");
            alert("Payment successful. You are now a premium user!");
            window.location.href = "/index.html";
          } else {
            document.body.innerHTML = `<h2>Payment failed or pending. Status: ${data.orderStatus}</h2>`;
          }
        } catch (err) {
          document.body.innerHTML = `<h2>Failed to verify payment status.</h2>`;
        }
      });
  </script>
</head>
<body>
  <h2>Verifying your payment...</h2>
</body>
</html>
